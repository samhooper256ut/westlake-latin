<title>Perīculum! — Stages 9–10</title>
<script>
/* ==========================================================================
   PERĪCULUM!  (Jeopardy for Latin 1, Cambridge Latin Course Stages 9–10)

   EDIT YOUR GAME HERE. Everything below is ordinary JavaScript:
     - keep the quotation marks and the commas between items;
     - inside a clue, write a quotation mark as \"  (backslash first);
     - *asterisks* around Latin words make them stand out on screen;
     - \n inside a clue starts a new line.
   Values go 100, 200, 300 ... down each column (see "values" below).
   The board rebuilds itself from this list, so you can have more or fewer
   categories or clues; just keep each category's clues in order of value.
   Opening the file after an edit starts a fresh game.
   ========================================================================== */
const GAME = {
  title: "PERĪCULUM!",
  subtitle: "Stages 9–10",

  teams: ["Rōmānī", "Graecī", "Pompēiānī", "Nūcerīnī", "Aegyptiī"],

  values: [100, 200, 300, 400, 500],
  romanNumerals: true,     // show the values as C, CC, CCC, CD, D (the number is shown small underneath)
  timerSeconds: 45,        // countdown on each clue; 0 = no timer
  finalTimerSeconds: 90,   // countdown on the final question
  sound: true,             // chime when the timer runs out

  categories: [
    { name: "VOCĀBULA", hint: "vocabulary", clues: [
      { q: "What does *celeriter* mean?",
        a: "quickly" },
      { q: "What does *inveniō* mean?",
        a: "I find" },
      { q: "The English word \"library\" comes from which Stage 10 noun, and what does that noun mean?",
        a: "*liber* — book" },
      { q: "Give the Latin for both: \"brother\" and \"wife\".",
        a: "*frāter* and *uxor*" },
      { q: "Translate:\n*cīvēs pācem cupiunt, sed inimīcī imperium capiunt.*",
        a: "The citizens want peace, but the enemies seize the empire." }
    ]},

    { name: "GRADŪS", hint: "degrees of adjectives", clues: [
      { q: "*laetus, laetior, laetissimus*\nName the three degrees, in order.",
        a: "positive, comparative, superlative" },
      { q: "What degree is *fortissimī*, and what does it mean?",
        a: "superlative — \"very brave\" or \"bravest\"" },
      { q: "Translate:\n*Alexander est callidior quam Quīntus.*",
        a: "Alexander is cleverer (more clever) than Quintus." },
      { q: "Give the superlatives of *magnus*, *bonus*, and *malus*.",
        a: "*maximus*, *optimus*, *pessimus*" },
      { q: "A superlative can end in three ways. Name all three endings, then give the superlative of *pulcher*.",
        a: "*-issimus*, *-rrimus*, *-llimus* — *pulcherrimus*" }
    ]},

    { name: "ADVERBIA", hint: "adverbs", clues: [
      { q: "True or false: in English, most adjectives end in -ly.",
        a: "False. Most adverbs end in -ly: quickly, bravely." },
      { q: "Turn *laetus* into an adverb, and translate it.",
        a: "*laetē* — happily" },
      { q: "Turn *fortis* into an adverb, and translate it.",
        a: "*fortiter* — bravely" },
      { q: "Make an adverb from each: *īrātus*, *callidus*, *ferōx*.",
        a: "*īrātē*, *callidē*, *ferōciter*" },
      { q: "*optimē* is an adverb. Which adjective is it made from, what degree is that adjective, and what does *optimē* mean?",
        a: "*optimus*, the superlative of *bonus* — \"very well\" or \"best\"" }
    ]},

    { name: "VERBA", hint: "verbs", clues: [
      { q: "Give the six personal endings of the present tense, in order.",
        a: "*-ō* (or *-m*), *-s*, *-t*, *-mus*, *-tis*, *-nt*" },
      { q: "What tense is *celebrābat*, and what does it mean?",
        a: "imperfect — \"he (she) was celebrating\"" },
      { q: "*labōrō* means \"I work.\"\nGive the Latin for \"we work\" and \"y'all work.\"",
        a: "*labōrāmus* and *labōrātis*" },
      { q: "Conjugate \"to be\" in the imperfect tense: all six forms.",
        a: "*eram, erās, erat, erāmus, erātis, erant*" },
      { q: "Give the Latin for \"I am,\" \"I was,\" \"I will be,\" and \"I have been.\"",
        a: "*sum, eram, erō, fuī*" }
    ]},

    { name: "CĀSŪS", hint: "nouns & pronouns", clues: [
      { q: "Which case shows the person something is given or shown to?",
        a: "the dative" },
      { q: "Give the dative singular and the dative plural of *servus*.",
        a: "*servō* and *servīs*" },
      { q: "Translate:\n*servī gladiātōribus tunicās ostendēbant.*",
        a: "The slaves were showing tunics to the gladiators." },
      { q: "Give the Latin for \"to me,\" \"to you,\" \"to us,\" and \"to y'all.\"",
        a: "*mihi, tibi, nōbīs, vōbīs*" },
      { q: "Write the ten endings of the 3rd declension (masculine and feminine): nominative to ablative, singular, then plural.",
        a: "singular: (varies), *-is, -ī, -em, -e*\nplural: *-ēs, -um, -ibus, -ēs, -ibus*" }
    ]}
  ],

  final: {
    name: "DIĒS",
    hint: "days of the week",
    q: "Write the seven days of the week in Latin, in order from Monday to Sunday.",
    a: "*diēs Lūnae, diēs Mārtis, diēs Mercuriī, diēs Iovis, diēs Veneris, diēs Sāturnī, diēs Sōlis*"
  }
};
/* ========================== end of the game data ========================== */
</script>

<style>
/* ---------- palette: a Pompeian wall ---------- */
:root {
  --cinnabar: #8c1d18;      /* red field */
  --cinnabar-deep: #6e1512;
  --carbon: #1e1511;        /* black panels */
  --carbon-soft: #2a1d18;
  --ochre: #d9a441;         /* yellow ochre: numerals, frames */
  --ochre-dim: #a8782c;
  --plaster: #f3e8d2;       /* cream text */
  --plaster-dim: rgba(243, 232, 210, 0.62);
  --verdigris: #3c8c78;     /* correct, timer */
  --verdigris-deep: #2b6a5a;
  --wrong: #5a1a14;
  --frame: 0 0 0 1px var(--ochre-dim) inset, 0 0 0 4px var(--carbon) inset, 0 0 0 5px var(--ochre-dim) inset;
  --serif: Georgia, "Times New Roman", Times, serif;
  --caps: "Cinzel", "Trajan Pro", "Cochin", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--cinnabar);
  color: var(--plaster);
  font-family: var(--serif);
  font-size: clamp(14px, 1.3vw, 22px);
  line-height: 1.35;
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100dvh;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.la { color: var(--ochre); font-style: normal; }           /* Latin inside a clue */
.answer .la { color: var(--plaster); }
.caps { font-family: var(--caps); font-weight: 600; letter-spacing: 0.04em; }
.hidden { display: none !important; }

/* ---------- header ---------- */
header {
  display: flex; align-items: baseline; gap: 1.2em; padding: 0.55em 1.4em 0.45em;
  border-bottom: 1px solid rgba(243, 232, 210, 0.25);
}
header h1 { font-family: var(--caps); font-weight: 800; font-size: clamp(22px, 2.6vw, 44px); margin: 0; letter-spacing: 0.06em; color: var(--plaster); }
header .sub { color: var(--plaster-dim); font-style: italic; }
header .tools { margin-left: auto; display: flex; gap: 0.5em; align-items: center; }
.btn {
  background: transparent; border: 1px solid rgba(243, 232, 210, 0.45); color: var(--plaster);
  padding: 0.35em 0.9em; border-radius: 3px; font-size: 0.95em; line-height: 1.2;
}
.btn:hover { border-color: var(--ochre); color: var(--ochre); }
.btn.primary { background: var(--ochre); color: var(--carbon); border-color: var(--ochre); font-weight: bold; }
.btn.primary:hover { background: #e7b65a; color: var(--carbon); }
.btn.quiet { border-color: transparent; color: var(--plaster-dim); }
.btn.quiet:hover { color: var(--ochre); }
.btn.icon { padding: 0.35em 0.55em; }
.btn.glow { border-color: var(--ochre); color: var(--ochre); }

/* ---------- board ---------- */
#board {
  display: grid; gap: 0.6vmin; padding: 0.9vmin 1.2vmin; min-height: 0;
}
.cat {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 0.3em 0.4em; min-height: 0;
}
.cat .name { font-family: var(--caps); font-weight: 700; font-size: clamp(14px, 2.1vw, 34px); letter-spacing: 0.06em; color: var(--plaster); line-height: 1.1; }
.cat .hint { color: var(--plaster-dim); font-style: italic; font-size: clamp(11px, 1.05vw, 18px); margin-top: 0.15em; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--carbon); border: 0; border-radius: 2px; box-shadow: var(--frame);
  color: var(--ochre); min-height: 0; padding: 0;
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.tile .num { font-family: var(--caps); font-weight: 700; font-size: clamp(24px, 4.6vw, 84px); line-height: 1; letter-spacing: 0.05em; }
.tile .arabic { font-family: var(--serif); color: var(--plaster-dim); font-size: clamp(10px, 1.05vw, 18px); margin-top: 0.35em; letter-spacing: 0.08em; }
.tile:hover, .tile:focus-visible { transform: translateY(-1px); box-shadow: 0 0 0 1px var(--ochre) inset, 0 0 0 4px var(--carbon) inset, 0 0 0 5px var(--ochre) inset; }
.tile.used { background: var(--cinnabar-deep); box-shadow: 0 0 0 1px rgba(217,164,65,0.22) inset; color: rgba(243,232,210,0.22); }
.tile.used .num { font-weight: 500; }
.tile.used .arabic { color: rgba(243,232,210,0.18); }
.tile.used:hover { box-shadow: 0 0 0 1px rgba(217,164,65,0.6) inset; color: rgba(243,232,210,0.5); }
@media (prefers-reduced-motion: reduce) { .tile, .panel { transition: none !important; animation: none !important; } }

/* ---------- scoreboard ---------- */
#scores {
  display: flex; gap: 0.8vmin; padding: 0.7vmin 1.2vmin 1vmin; border-top: 1px solid rgba(243, 232, 210, 0.25);
  overflow-x: auto;
}
.team {
  flex: 1 1 0; min-width: 7em; background: var(--carbon); box-shadow: var(--frame); border-radius: 2px;
  display: flex; align-items: center; justify-content: space-between; gap: 0.6em; padding: 0.55em 1em;
}
.team .tname { font-size: clamp(14px, 1.5vw, 26px); color: var(--plaster); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .tscore { font-family: var(--caps); font-weight: 700; font-size: clamp(18px, 2.2vw, 38px); color: var(--ochre); letter-spacing: 0.04em; }
.team .tscore.neg { color: #e08a7e; }
.team.lead .tname::before { content: "\2726\00a0"; color: var(--ochre); }

/* ---------- clue panel (also used for the final question) ---------- */
#overlay {
  position: fixed; inset: 0; background: var(--cinnabar); display: grid; grid-template-rows: auto 1fr auto;
  padding: 1.2vmin 1.4vmin; z-index: 10;
}
#overlay .bar { display: flex; align-items: baseline; gap: 1em; padding: 0.2em 0.6em 0.6em; }
#overlay .bar .where { font-family: var(--caps); font-weight: 700; letter-spacing: 0.06em; font-size: clamp(16px, 2vw, 32px); color: var(--plaster); }
#overlay .bar .where .val { color: var(--ochre); margin-left: 0.6em; }
#overlay .bar .where .hint { font-family: var(--serif); font-weight: normal; letter-spacing: 0; font-style: italic; color: var(--plaster-dim); font-size: 0.6em; margin-left: 0.8em; }
#timer { margin-left: auto; font-family: var(--caps); font-weight: 700; font-size: clamp(18px, 2.2vw, 36px); color: var(--ochre); letter-spacing: 0.05em; cursor: pointer; user-select: none; min-width: 3.2em; text-align: right; }
#timer.paused { color: var(--plaster-dim); }
#timer.out { color: var(--plaster); }
#timer small { font-family: var(--serif); font-weight: normal; font-size: 0.5em; letter-spacing: 0; color: var(--plaster-dim); margin-left: 0.5em; }
.panel {
  position: relative; background: var(--carbon); box-shadow: var(--frame); border-radius: 2px; min-height: 0;
  display: grid; grid-template-rows: auto 1fr auto; padding: 1.6vmin 3vmin 1.4vmin; overflow: hidden;
  transform-origin: center; animation: open 180ms ease-out;
}
@keyframes open { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.panel .tbar { position: absolute; left: 5px; right: 5px; top: 5px; height: 3px; background: rgba(217,164,65,0.18); }
.panel .tbar > div { height: 100%; background: var(--ochre); width: 100%; transition: width 250ms linear; }
.panel .tbar.out > div { background: var(--plaster); }
.panel .tbar.paused > div { background: var(--ochre-dim); }
.panel .text { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; overflow: hidden; }
.clue { font-size: 64px; line-height: 1.25; color: var(--plaster); max-width: 94%; margin: 0; }
.answer { font-size: 48px; line-height: 1.25; color: var(--ochre); margin: 0.5em 0 0; max-width: 94%; padding-top: 0.5em; border-top: 1px solid rgba(217,164,65,0.4); }
.panel .text.answered .clue { opacity: 0.8; }
.panel .foot { display: flex; align-items: center; gap: 0.8em; flex-wrap: wrap; padding-top: 1vmin; }
.panel .foot .teams { display: flex; gap: 0.5em; flex-wrap: wrap; flex: 1 1 auto; }
.panel .foot .end { margin-left: auto; display: flex; gap: 0.5em; align-items: center; }
.award {
  display: inline-flex; align-items: center; gap: 0.1em; background: var(--carbon-soft); border: 1px solid rgba(243,232,210,0.3); border-radius: 3px; overflow: hidden;
}
.award .n { padding: 0.35em 0.7em; font-size: clamp(13px, 1.3vw, 22px); }
.award .k { padding: 0.35em 0.5em; font-size: 0.9em; }
.award button { background: transparent; border: 0; border-left: 1px solid rgba(243,232,210,0.2); padding: 0.4em 0.75em; font-size: clamp(13px, 1.3vw, 22px); line-height: 1; }
.award button:hover { background: rgba(243,232,210,0.08); }
.award.right { border-color: var(--verdigris); background: var(--verdigris-deep); }
.award.right .yes { background: var(--verdigris); color: #fff; }
.award.wrong { border-color: #b4473c; background: var(--wrong); }
.award.wrong .no { background: #8e2a21; color: #fff; }
.award input { width: 5em; background: #120c0a; color: var(--ochre); border: 0; border-left: 1px solid rgba(243,232,210,0.2); padding: 0.4em 0.5em; font: inherit; font-size: clamp(13px, 1.3vw, 22px); text-align: right; }
.award input::-webkit-outer-spin-button, .award input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.keys { color: var(--plaster-dim); font-size: 0.85em; white-space: pre; }

/* ---------- settings dialog ---------- */
dialog { background: var(--carbon); color: var(--plaster); border: 0; box-shadow: var(--frame); border-radius: 3px; padding: 1.6em 1.8em; width: min(92vw, 34em); font-size: 1rem; }
dialog::backdrop { background: rgba(30, 21, 17, 0.75); }
dialog h2 { font-family: var(--caps); font-weight: 700; letter-spacing: 0.06em; margin: 0 0 0.8em; font-size: 1.4em; color: var(--ochre); }
dialog h3 { font-size: 1em; margin: 1.2em 0 0.4em; color: var(--plaster-dim); font-weight: normal; font-style: italic; }
dialog .row { display: flex; align-items: center; gap: 0.6em; margin: 0.35em 0; }
dialog input[type=text], dialog input[type=number] { background: #120c0a; color: var(--plaster); border: 1px solid rgba(243,232,210,0.3); padding: 0.35em 0.6em; font: inherit; border-radius: 3px; }
dialog input[type=text] { flex: 1 1 auto; }
dialog input[type=number] { width: 5.5em; }
dialog label { display: flex; align-items: center; gap: 0.5em; }
dialog .actions { display: flex; gap: 0.6em; margin-top: 1.4em; flex-wrap: wrap; }
dialog .danger { color: #e08a7e; border-color: #8e2a21; }
dialog p.note { color: var(--plaster-dim); font-size: 0.9em; margin: 0.4em 0 0; }
#dataError { position: fixed; inset: 0; background: var(--carbon); color: var(--plaster); padding: 3em; font-size: 1.2em; z-index: 50; }
#dataError code { color: var(--ochre); }

@media (max-width: 700px) {
  header { flex-wrap: wrap; gap: 0.4em 0.8em; }
  .tile .arabic { display: none; }
  .panel .foot .end { margin-left: 0; }
}

<section id="overlay" class="hidden" aria-live="polite">
  <div class="bar">
    <div class="where" id="where"></div>
    <div id="timer" title="Click to pause or resume (T). R restarts."></div>
  </div>
  <div class="panel" id="panel">
    <div class="tbar" id="tbar"><div id="tfill"></div></div>
    <div></div>
    <div class="text" id="text">
      <p class="clue" id="clueText"></p>
      <p class="answer hidden" id="answerText"></p>
    </div>
    <div class="foot">
      <div class="teams" id="awards"></div>
      <div class="end">
        <span class="keys" id="keys"></span>
        <button class="btn" id="cancelBtn" title="Close without using this clue (Esc)">omitte</button>
        <button class="btn primary" id="revealBtn">ostende respōnsum</button>
        <button class="btn primary hidden" id="backBtn">ad tabulam</button>
      </div>
    </div>
  </div>
</section>

<dialog id="settings">
  <h2>Settings</h2>
  <h3>Teams (names are shown on the board)</h3>
  <div id="teamRows"></div>
  <div class="row"><button class="btn" id="addTeam">+ add a team</button></div>
  <h3>Timer</h3>
  <div class="row"><label>Seconds per clue <input type="number" id="setTimer" min="0" max="600"></label>
    <label>Final question <input type="number" id="setFinalTimer" min="0" max="900"></label></div>
  <div class="row"><label><input type="checkbox" id="setSound"> chime when time runs out</label></div>
  <div class="actions">
    <button class="btn primary" id="saveSettings">Save</button>
    <button class="btn" id="closeSettings">Cancel</button>
    <button class="btn danger" id="newGame" title="Clears the board and all scores; keeps the teams">lūdus novus (new game)</button>
  </div>
  <p class="note">Scores and used clues are remembered in this browser until you start a new game. To change the questions, edit the list at the top of this file and reload.</p>
</dialog>

<script>
(function () {
  "use strict";
  // ---------- guard: a typo in the question list shows a helpful message instead of a blank page
  if (typeof GAME === "undefined" || !GAME || !Array.isArray(GAME.categories)) {
    const d = document.createElement("div"); d.id = "dataError";
    d.innerHTML = "<h1>The question list could not be read.</h1><p>There is a typo in the <code>const GAME = { ... }</code> block near the top of this file, usually a missing comma, quotation mark, or bracket. Open the file in a text editor, fix it, and reload.</p>";
    document.body.appendChild(d); return;
  }

  // ---------- helpers
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const fmt = (s) => esc(s).replace(/\*([^*]+)\*/g, '<i class="la">$1</i>').replace(/\n/g, "<br>");
  const roman = (n) => { if (!GAME.romanNumerals || n <= 0 || n >= 4000) return String(n);
    const t = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
    let r = ""; for (const [v, s] of t) while (n >= v) { r += s; n -= v; } return r; };
  const values = (ci, ri) => (GAME.categories[ci].clues[ri].value != null ? GAME.categories[ci].clues[ri].value : (GAME.values || [100,200,300,400,500])[ri] || (ri + 1) * 100);
  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); };
  const KEY = "periculum:" + hash(JSON.stringify([GAME.categories, GAME.final, GAME.teams, GAME.values]));

  // ---------- state (remembered in this browser)
  const fresh = () => ({
    teams: (GAME.teams || ["Grex I", "Grex II"]).map((n, i) => ({ id: "t" + i + "_" + Date.now().toString(36), name: n, adj: 0 })),
    used: {}, awards: {}, final: { stage: 0, wagers: {}, marks: {} },
    settings: { timer: GAME.timerSeconds ?? 45, finalTimer: GAME.finalTimerSeconds ?? 90, sound: GAME.sound !== false }
  });
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !state.teams) state = fresh();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private window: play on without memory */ } };

  const score = (team) => {
    let s = team.adj || 0;
    for (const k in state.awards) { const m = state.awards[k][team.id]; if (m) { const [ci, ri] = k.split("-").map(Number); s += m * values(ci, ri); } }
    const fm = state.final.marks[team.id]; if (fm) s += fm * (Number(state.final.wagers[team.id]) || 0);
    return s;
  };

  // ---------- header
  $("title").textContent = GAME.title || "PERĪCULUM!";
  $("subtitle").textContent = GAME.subtitle || "";

  // ---------- board
  const board = $("board");
  function renderBoard() {
    const cats = GAME.categories, rows = Math.max(...cats.map(c => c.clues.length));
    board.style.gridTemplateColumns = `repeat(${cats.length}, 1fr)`;
    board.style.gridTemplateRows = `auto repeat(${rows}, 1fr)`;
    board.innerHTML = "";
    cats.forEach((c) => {
      const h = document.createElement("div"); h.className = "cat";
      h.innerHTML = `<div class="name">${esc(c.name)}</div>` + (c.hint ? `<div class="hint">${esc(c.hint)}</div>` : "");
      board.appendChild(h);
    });
    for (let ri = 0; ri < rows; ri++) cats.forEach((c, ci) => {
      const b = document.createElement("button"); b.className = "tile";
      if (!c.clues[ri]) { b.disabled = true; b.style.visibility = "hidden"; board.appendChild(b); return; }
      const v = values(ci, ri); const k = ci + "-" + ri;
      b.innerHTML = `<span class="num">${roman(v)}</span>` + (GAME.romanNumerals ? `<span class="arabic">${v}</span>` : "");
      b.title = `${c.name}, ${v}`; b.setAttribute("aria-label", `${c.name} for ${v}` + (state.used[k] ? " (used)" : ""));
      if (state.used[k]) b.classList.add("used");
      b.addEventListener("click", () => openClue(ci, ri));
      board.appendChild(b);
    });
    const all = cats.reduce((n, c) => n + c.clues.length, 0), done = Object.keys(state.used).length;
    $("finalBtn").classList.toggle("glow", all > 0 && done >= all && !!GAME.final);
    $("finalBtn").classList.toggle("hidden", !GAME.final);
  }

  // ---------- scoreboard
  function renderScores() {
    const el = $("scores"); el.innerHTML = "";
    const ss = state.teams.map(score); const top = Math.max(...ss);
    state.teams.forEach((t, i) => {
      const d = document.createElement("div"); d.className = "team" + (ss[i] === top && top > 0 && ss.filter(x => x === top).length === 1 ? " lead" : "");
      d.innerHTML = `<span class="tname">${esc(t.name)}</span><span class="tscore${ss[i] < 0 ? " neg" : ""}">${ss[i]}</span>`;
      d.title = "Scores are set on the clue screens; adjust them in settings."; el.appendChild(d);
    });
  }

  // ---------- timer
  let tm = { total: 0, left: 0, running: false, handle: null, last: 0 };
  function timerStart(seconds) {
    timerStop(); tm.total = seconds; tm.left = seconds; $("timer").className = ""; $("tbar").className = "tbar";
    if (!seconds) { $("timer").textContent = ""; $("tbar").classList.add("hidden"); return; }
    $("tbar").classList.remove("hidden"); tm.running = true; tm.last = performance.now(); tick();
    tm.handle = setInterval(tick, 200);
  }
  function tick() {
    if (tm.running) { const now = performance.now(); tm.left = Math.max(0, tm.left - (now - tm.last) / 1000); tm.last = now; }
    const s = Math.ceil(tm.left); $("timer").textContent = s > 0 ? String(s) : "tempus!";
    $("tfill").style.width = (tm.total ? (tm.left / tm.total) * 100 : 0) + "%";
    if (tm.left <= 0 && tm.running) { tm.running = false; $("timer").classList.add("out"); $("tbar").classList.add("out"); chime(); }
  }
  function timerStop() { if (tm.handle) clearInterval(tm.handle); tm.handle = null; tm.running = false; }
  function timerToggle() { if (!tm.total || tm.left <= 0) return; tm.running = !tm.running; tm.last = performance.now();
    $("timer").classList.toggle("paused", !tm.running); $("tbar").classList.toggle("paused", !tm.running); }
  function timerRestart() { if (tm.total) timerStart(tm.total); }
  let audio = null;
  function chime() {
    if (!state.settings.sound) return;
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const t0 = audio.currentTime;
      [[660, 0], [880, 0.18]].forEach(([f, dt]) => { const o = audio.createOscillator(), g = audio.createGain(); o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(0.25, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.5);
        o.connect(g).connect(audio.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.55); });
    } catch (e) { /* no audio available */ }
  }

  // ---------- clue screen
  let cur = null;   // { ci, ri } or { final: true }
  let revealed = false;
  const overlay = $("overlay");
  function fit() {
    const box = $("text"); const clue = $("clueText"), ans = $("answerText");
    let size = Math.min(96, Math.max(28, Math.round(window.innerWidth / 20)));
    const apply = () => { clue.style.fontSize = size + "px"; ans.style.fontSize = Math.round(size * 0.78) + "px"; };
    apply(); let guard = 0;
    while (box.scrollHeight > box.clientHeight + 2 && size > 18 && guard++ < 40) { size -= 2; apply(); }
  }
  function openClue(ci, ri) {
    cur = { ci, ri }; const c = GAME.categories[ci], q = c.clues[ri], v = values(ci, ri); const k = ci + "-" + ri;
    $("where").innerHTML = `${esc(c.name)}<span class="val">${roman(v)}${GAME.romanNumerals ? ` <small style="font-family:var(--serif);font-weight:normal;letter-spacing:0;color:var(--plaster-dim)">${v}</small>` : ""}</span>` + (c.hint ? `<span class="hint">${esc(c.hint)}</span>` : "");
    $("clueText").innerHTML = fmt(q.q); $("answerText").innerHTML = fmt(q.a); $("revealBtn").textContent = "ostende respōnsum";
    revealed = !!state.used[k];
    showStage(); renderAwards(); overlay.classList.remove("hidden"); fit();
    if (revealed) timerStart(0); else timerStart(state.settings.timer);
    $("revealBtn").focus();
  }
  function showStage() {
    $("answerText").classList.toggle("hidden", !revealed); $("text").classList.toggle("answered", revealed);
    $("revealBtn").classList.toggle("hidden", revealed); $("backBtn").classList.toggle("hidden", !revealed);
    $("awards").classList.toggle("hidden", !revealed && !(cur && cur.final));
    $("cancelBtn").classList.toggle("hidden", revealed);
    $("keys").textContent = revealed ? "✓ adds the points, ✗ takes them away      keys 1–9 = ✓" : (cur && cur.final && state.final.stage === 0 ? "space = show the question      esc = close" : "space = show the answer      esc = close");
    fit();
  }
  function reveal() {
    if (!cur) return; revealed = true; timerStop(); $("timer").className = ""; $("timer").textContent = ""; $("tbar").classList.add("hidden");
    if (!cur.final) { state.used[cur.ci + "-" + cur.ri] = true; save(); }
    else { state.final.stage = 2; save(); }
    showStage(); renderAwards(); renderBoard(); $("backBtn").focus();
  }
  function closeClue() { timerStop(); overlay.classList.add("hidden"); cur = null; renderBoard(); renderScores(); }
  function renderAwards() {
    const el = $("awards"); el.innerHTML = ""; if (!cur) return;
    const isFinal = !!cur.final; const k = isFinal ? null : cur.ci + "-" + cur.ri;
    const marks = isFinal ? state.final.marks : (state.awards[k] || {});
    state.teams.forEach((t, i) => {
      const m = marks[t.id] || 0;
      const d = document.createElement("div"); d.className = "award" + (m > 0 ? " right" : m < 0 ? " wrong" : "");
      const buttons = (!isFinal || revealed) ? `<button class="yes" title="correct: +${isFinal ? "wager" : values(cur.ci, cur.ri)} (${i + 1})" aria-label="${esc(t.name)} correct">✓</button><button class="no" title="wrong: −${isFinal ? "wager" : values(cur.ci, cur.ri)}" aria-label="${esc(t.name)} wrong">✗</button>` : "";
      d.innerHTML = `<span class="n">${esc(t.name)}</span>` + (isFinal ? `<input type="number" min="0" step="100" placeholder="wager" aria-label="wager for ${esc(t.name)}" value="${state.final.wagers[t.id] ?? ""}">` : "") + buttons;
      if (isFinal) { const inp = d.querySelector("input");
        inp.addEventListener("change", () => { state.final.wagers[t.id] = Math.max(0, Number(inp.value) || 0); save(); renderScores(); }); }
      if (buttons) { d.querySelector(".yes").addEventListener("click", () => mark(t.id, 1)); d.querySelector(".no").addEventListener("click", () => mark(t.id, -1)); }
      el.appendChild(d);
    });
  }
  function mark(teamId, val) {
    if (!cur) return;
    if (cur.final) { if (!revealed) return; state.final.marks[teamId] = state.final.marks[teamId] === val ? 0 : val; }
    else { const k = cur.ci + "-" + cur.ri; state.awards[k] = state.awards[k] || {}; state.awards[k][teamId] = state.awards[k][teamId] === val ? 0 : val; }
    save(); renderAwards(); renderScores();
  }

  // ---------- final question
  function openFinal() {
    if (!GAME.final) return; cur = { final: true }; const f = GAME.final;
    $("where").innerHTML = `QUAESTIŌ ULTIMA<span class="val">${esc(f.name || "")}</span>` + (f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "");
    revealed = state.final.stage >= 2;
    if (state.final.stage === 0) {
      $("clueText").innerHTML = `<span class="la">${esc(f.name || "")}</span><br><span style="font-size:0.6em;color:var(--plaster-dim)">Teams write their wagers now.<br>Enter each wager below, then press <b>ostende quaestiōnem</b>.</span>`;
      $("revealBtn").textContent = "ostende quaestiōnem";
    } else { $("clueText").innerHTML = fmt(f.q); $("revealBtn").textContent = "ostende respōnsum"; }
    $("answerText").innerHTML = fmt(f.a);
    showStage(); renderAwards(); overlay.classList.remove("hidden"); fit();
    if (state.final.stage === 1) timerStart(state.settings.finalTimer); else timerStart(0);
    $("revealBtn").focus();
  }
  function finalNext() {
    if (state.final.stage === 0) { state.final.stage = 1; save(); openFinal(); }
    else reveal();
  }

  // ---------- settings
  const dlg = $("settings");
  function openSettings() {
    const rows = $("teamRows"); rows.innerHTML = "";
    state.teams.forEach((t, i) => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<input type="text" value="${esc(t.name)}" aria-label="team name"><label title="Points added to (or, if negative, taken from) this team's score">adjust <input type="number" step="100" value="${t.adj || 0}" aria-label="score adjustment"></label><button class="btn quiet icon" title="remove team" aria-label="remove team">✕</button>`;
      r.querySelector("button").addEventListener("click", () => { if (state.teams.length > 1) { state.teams.splice(i, 1); openSettings(); } });
      rows.appendChild(r);
    });
    $("setTimer").value = state.settings.timer; $("setFinalTimer").value = state.settings.finalTimer; $("setSound").checked = !!state.settings.sound;
    dlg.showModal();
  }
  $("addTeam").addEventListener("click", () => { readRows(); state.teams.push({ id: "t" + Date.now().toString(36), name: "Grex " + roman(state.teams.length + 1), adj: 0 }); openSettings(); });
  function readRows() { [...$("teamRows").children].forEach((r, i) => { const [n, a] = r.querySelectorAll("input"); if (state.teams[i]) { state.teams[i].name = n.value.trim() || state.teams[i].name; state.teams[i].adj = Number(a.value) || 0; } }); }
  $("saveSettings").addEventListener("click", () => { readRows(); state.settings.timer = Math.max(0, Number($("setTimer").value) || 0); state.settings.finalTimer = Math.max(0, Number($("setFinalTimer").value) || 0); state.settings.sound = $("setSound").checked; save(); dlg.close(); renderScores(); });
  $("closeSettings").addEventListener("click", () => dlg.close());
  $("newGame").addEventListener("click", () => { if (confirm("Start a new game? The board is reset and all scores return to zero.")) { const t = state.teams.map(x => ({ ...x, adj: 0 })); const s = state.settings; state = fresh(); state.teams = t; state.settings = s; save(); dlg.close(); renderBoard(); renderScores(); } });

  // ---------- wiring
  $("revealBtn").addEventListener("click", () => cur && cur.final ? finalNext() : reveal());
  $("backBtn").addEventListener("click", closeClue);
  $("cancelBtn").addEventListener("click", closeClue);
  $("timer").addEventListener("click", timerToggle);
  $("finalBtn").addEventListener("click", openFinal);
  $("settingsBtn").addEventListener("click", openSettings);
  $("fullBtn").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}));
  document.addEventListener("keydown", (e) => {
    if (dlg.open || e.target.tagName === "INPUT") return;
    if (e.key === "f" || e.key === "F") { $("fullBtn").click(); return; }
    if (overlay.classList.contains("hidden")) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!revealed) (cur.final ? finalNext() : reveal()); else closeClue(); }
    else if (e.key === "Escape") { e.preventDefault(); closeClue(); }
    else if (e.key === "t" || e.key === "T") timerToggle();
    else if (e.key === "r" || e.key === "R") timerRestart();
    else if (/^[1-9]$/.test(e.key) && revealed) { const t = state.teams[Number(e.key) - 1]; if (t) mark(t.id, 1); }
  });
  window.addEventListener("resize", () => { if (!overlay.classList.contains("hidden")) fit(); });
  document.fonts && document.fonts.ready.then(() => { if (!overlay.classList.contains("hidden")) fit(); });

  renderBoard(); renderScores();
})();
</script>
</body>
</html>
